[project]
name = "permission-aware-rag"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "chromadb>=1.5.9",
    "numpy<2",
    "sentence-transformers>=3.3,<4",
    "torch==2.2.2",
    "transformers>=4.44,<4.50",
]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
